name: Bot O Caça Preço

on:
  schedule:
    - cron: "*/10 * * * *"      # lê suas mensagens a cada ~10 minutos
    - cron: "7 * * * *"         # modo automático: até 10 ofertas por hora (o bot só publica das 8h às 23h)
  workflow_dispatch:
    inputs:
      modo:
        description: "mensagens = só ler o Telegram · buscar = procurar ofertas agora"
        default: mensagens
        type: choice
        options: [mensagens, auto, buscar, video]

permissions:
  contents: write   # para guardar o estado do bot (pasta state/)

concurrency:
  group: bot-ocacapreco
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Rodar o bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODO: ${{ github.event.schedule == '7 * * * *' && 'auto' || inputs.modo || 'mensagens' }}
        run: python bot.py

      - name: Guardar estado
        if: always()
        run: |
          git config user.name "ocacapreco-bot"
          git config user.email "ocacapreco-bot@users.noreply.github.com"
          mkdir -p state
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza estado do bot"
            for i in 1 2 3; do
              git pull --rebase -X theirs && git push && break
              sleep 5
            done
          fi
